services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: kpl
      MYSQL_USER: kpl
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://kpl:${MYSQL_PASSWORD:-change-me}@db:3306/kpl
      SERVER_PORT: 3001
    ports:
      - "3001:3001"
    # Keep stdin open so the admin CLI (motd, room list, player kick...) works via `docker attach`
    stdin_open: true
    tty: true

  client:
    build:
      context: ./client
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-ws://localhost:3001}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  db-data:
